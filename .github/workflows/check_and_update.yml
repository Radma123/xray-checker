name: Hourly Xray Config Checker & Repo Updater

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: xray-config-checker
  cancel-in-progress: true

jobs:
  run-checker:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt

    - name: Run unit tests
      run: python -m unittest discover -v

    - name: Run checker script
      env:
        INTERNET_SUBS_POOL: ${{ secrets.INTERNET_SUBS_POOL }}
        WHITELISTED_SUBS_POOL: ${{ secrets.WHITELISTED_SUBS_POOL }}
        INTERNET_CFGS_COUNT: ${{ vars.INTERNET_CFGS_COUNT }}
        WHITELISTED_CFGS_COUNT: ${{ vars.WHITELISTED_CFGS_COUNT }}
        CONCURRENT_THREADS_CHECK_DEFAULT: ${{ vars.CONCURRENT_THREADS_CHECK_DEFAULT }}
        MAX_LINKS_TO_CHECK_INTERNET: ${{ vars.MAX_LINKS_TO_CHECK_INTERNET }}
        MAX_LINKS_TO_CHECK_WHITELIST: ${{ vars.MAX_LINKS_TO_CHECK_WHITELIST }}
      run: python checker.py

    - name: Commit and Push changes
      run: |
        if [ ! -f "v2ray_sub.txt" ]; then
          echo "Файл v2ray_sub.txt не найден!"
          exit 1
        fi

        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"

        git add -f v2ray_sub.txt

        if git diff --cached --quiet; then
          echo "Нет изменений для коммита"
          exit 0
        fi

        git commit -m "Auto-update subscription links [skip ci]"
        git push origin HEAD:main
